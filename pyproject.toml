[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manhua-panel-extractor"
version = "0.1.0"
description = "Extract individual panels from long vertical manhua/webtoon strip images."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
]

[project.scripts]
extract-panels = "panel_extractor.cli:main"